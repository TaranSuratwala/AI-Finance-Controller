<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Finance Controller | Razorpay Buildathon</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-200 font-sans min-h-screen">
    <div class="max-w-6xl mx-auto p-6">
        <header class="flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
            <div>
                <h1 class="text-3xl font-bold text-blue-400">AI Finance Controller</h1>
                <p class="text-sm text-slate-400">Verifiable Autonomous Reconciliation</p>
            </div>
            <button onclick="triggerBatch()" id="runBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded font-semibold transition-colors">
                ▶ Run Simulation Batch
            </button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <!-- Ledger Card -->
            <div class="bg-slate-800 p-6 rounded-lg border border-slate-700 shadow-lg">
                <h2 class="text-xl font-semibold mb-2 text-green-400">Ledger Entries (Settled)</h2>
                <div class="text-5xl font-mono" id="ledgerCount">0</div>
                <p class="text-xs text-slate-400 mt-2">Passed Deterministic Gate</p>
            </div>
            <!-- Exception Card -->
            <div class="bg-slate-800 p-6 rounded-lg border border-slate-700 shadow-lg">
                <h2 class="text-xl font-semibold mb-2 text-red-400">Exception Queue (Suspense)</h2>
                <div class="text-5xl font-mono" id="exceptionCount">0</div>
                <p class="text-xs text-slate-400 mt-2">Failed Deterministic Gate (Requires HITL)</p>
            </div>
        </div>

        <div class="bg-slate-800 rounded-lg border border-slate-700 shadow-lg overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-700 bg-slate-850">
                <h2 class="text-xl font-semibold">Forensic Audit Trail (Exceptions)</h2>
            </div>
            <div class="p-6">
                <pre id="exceptionLog" class="text-sm font-mono text-slate-300 overflow-x-auto whitespace-pre-wrap">Waiting for data...</pre>
            </div>
        </div>
    </div>

    <script>
        const mockData = [
            {
                "settlement_id": "SETT_123",
                "amount": 105.00,
                "gateway_fee": 5.00,
                "description": "Razorpay payout for standard invoices"
            },
            {
                "settlement_id": "SETT_999",
                "amount": 50.00,
                "gateway_fee": 2.00,
                "description": "Test for stale state invoice 99"
            }
        ];

        async function triggerBatch() {
            const btn = document.getElementById('runBtn');
            btn.disabled = true;
            btn.innerText = "Processing...";
            btn.classList.replace('bg-blue-600', 'bg-slate-600');

            try {
                await fetch('/v1/reconcile/batch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(mockData)
                });
                // Start rapid polling to show live updates
                let polls = 0;
                const interval = setInterval(async () => {
                    await fetchDashboard();
                    polls++;
                    if (polls > 10) { 
                        clearInterval(interval); 
                        btn.disabled = false;
                        btn.innerText = "▶ Run Simulation Batch";
                        btn.classList.replace('bg-slate-600', 'bg-blue-600');
                    }
                }, 1000);
            } catch (e) {
                alert("Error triggering batch: " + e.message);
            }
        }

        async function fetchDashboard() {
            try {
                const res = await fetch('/v1/dashboard');
                const data = await res.json();
                
                document.getElementById('ledgerCount').innerText = data.ledger_entries;
                document.getElementById('exceptionCount').innerText = data.exception_count;
                
                if (data.exceptions.length > 0) {
                    document.getElementById('exceptionLog').innerText = JSON.stringify(data.exceptions, null, 2);
                    document.getElementById('exceptionLog').classList.add('text-red-300');
                } else {
                    document.getElementById('exceptionLog').innerText = "No exceptions logged yet.";
                    document.getElementById('exceptionLog').classList.remove('text-red-300');
                }
            } catch (e) {
                console.error("Dashboard fetch error:", e);
            }
        }

        // Initial fetch
        fetchDashboard();
    </script>
</body>
</html>
